name: Update FIRMS fire progression

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: update-fire-progression
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Restore ESA WorldCover tile cache
        uses: actions/cache@v4
        with:
          path: pipeline/data/external/worldcover_2021_v200_cache
          key: worldcover-france-v1-${{ github.run_id }}
          restore-keys: |
            worldcover-france-v1-

      - name: Restore cumulative FIRMS state
        uses: actions/cache@v4
        with:
          path: |
            pipeline/data/raw/firms_detections_history.csv
            pipeline/data/processed/fires_state
          key: firms-cumulative-state-${{ github.run_id }}
          restore-keys: |
            firms-cumulative-state-

      - name: Run FIRMS progression pipeline (per active fire, nationwide)
        env:
          MPLBACKEND: Agg
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          pipeline/scripts/run_live_progression_multi.sh

      - name: Save ESA WorldCover tile cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: pipeline/data/external/worldcover_2021_v200_cache
          key: worldcover-france-v1-${{ github.run_id }}

      - name: Save cumulative FIRMS state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            pipeline/data/raw/firms_detections_history.csv
            pipeline/data/processed/fires_state
          key: firms-cumulative-state-${{ github.run_id }}

      - name: Commit updated progression
        run: |
          # run_live_progression_multi.sh écrit déjà directement dans
          # data/fire-progression/ (index, registre, sorties par feu) :
          # rien à copier, seulement à valider et committer.
          if git diff --quiet -- data/fire-progression/ && \
             [ -z "$(git status --porcelain -- data/fire-progression/)" ]
          then
            echo "Aucun nouveau passage FIRMS : aucun commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fire-progression/

          git commit -m "Update FIRMS fire progression"
          git push
