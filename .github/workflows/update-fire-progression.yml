name: Update FIRMS fire progression

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: update-fire-progression
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run FIRMS progression pipeline
        env:
          MPLBACKEND: Agg
        run: |
          pipeline/scripts/run_live_progression.sh

      - name: Publish web exports
        run: |
          cp \
            pipeline/data/web/fire_progression_arrival_v1.geojson \
            pipeline/data/web/fire_progression_arrival_v1_manifest.json \
            data/fire-progression/

      - name: Commit updated progression
        run: |
          if git diff --quiet -- \
            data/fire-progression/fire_progression_arrival_v1.geojson \
            data/fire-progression/fire_progression_arrival_v1_manifest.json
          then
            echo "Aucun nouveau passage FIRMS : aucun commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/fire-progression/fire_progression_arrival_v1.geojson \
            data/fire-progression/fire_progression_arrival_v1_manifest.json

          git commit -m "Update FIRMS fire progression"
          git push
