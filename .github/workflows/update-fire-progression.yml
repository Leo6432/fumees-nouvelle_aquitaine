name: Update FIRMS fire progression

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: update-fire-progression
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Cache ESA WorldCover tiles
        uses: actions/cache@v4
        with:
          path: pipeline/data/external/worldcover_2021_v200
          key: worldcover-2021-v200-N42W003-N45W003-v1

      - name: Restore cumulative FIRMS state
        uses: actions/cache@v4
        with:
          path: |
            pipeline/data/raw/firms_detections_history.csv
            pipeline/data/processed/detection_envelopes.gpkg
          key: firms-cumulative-state-${{ github.run_id }}
          restore-keys: |
            firms-cumulative-state-

      - name: Run FIRMS progression pipeline
        env:
          MPLBACKEND: Agg
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          pipeline/scripts/run_live_progression.sh

      - name: Publish web exports
        run: |
          cp \
            pipeline/data/web/fire_progression_arrival_v1.geojson \
            pipeline/data/web/fire_progression_arrival_v1_manifest.json \
            data/fire-progression/

          cp \
            pipeline/data/web/detection_envelopes.geojson \
            detection_envelopes.geojson

      - name: Save cumulative FIRMS state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            pipeline/data/raw/firms_detections_history.csv
            pipeline/data/processed/detection_envelopes.gpkg
          key: firms-cumulative-state-${{ github.run_id }}

      - name: Commit updated progression
        run: |
          if git diff --quiet -- \
            data/fire-progression/fire_progression_arrival_v1.geojson \
            data/fire-progression/fire_progression_arrival_v1_manifest.json \
            detection_envelopes.geojson
          then
            echo "Aucun nouveau passage FIRMS : aucun commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/fire-progression/fire_progression_arrival_v1.geojson \
            data/fire-progression/fire_progression_arrival_v1_manifest.json \
            detection_envelopes.geojson

          git commit -m "Update FIRMS fire progression"
          git push
