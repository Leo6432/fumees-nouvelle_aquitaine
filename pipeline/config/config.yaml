# ============================================================
# fire-propagation — configuration
# Analyse de la progression d'un incendie à partir de détections
# thermiques FIRMS (temps d'arrivée, isochrones, rose de propagation,
# corrélation avec le vent).
# ============================================================

project_name: fire_propagation_france_2026

# --- Zone et période d'étude ---------------------------------
# bbox en WGS84 : ouest, sud, est, nord
# France métropolitaine + petite marge (même emprise que feuxgironde).
# Chaque feu individuel est ensuite isolé automatiquement par le
# clustering ci-dessous (00_detect_active_fires.py) : cette bbox ne
# sert qu'à la requête FIRMS nationale, pas à délimiter un feu précis.
bbox: [-5.3, 41.2, 9.7, 51.3]

# Fenêtre temporelle analysée (UTC). 'auto' : pas de coupure de date —
# chaque feu est déjà isolé à ses propres détections par le clustering
# nationwide (00_detect_active_fires.py) avant d'atteindre ce filtre,
# donc une origine codée en dur par feu n'est plus nécessaire ici.
time_window:
  start: "auto"
  end: "auto"

  # Fenêtre réservée aux foyers actifs affichés sur la carte.
  max_hours: 48

# --- Projection métrique -------------------------------------
# Toutes les distances/interpolations se font en projeté, pas en degrés.
crs_metric: "EPSG:2154"   # Lambert-93 (France métropolitaine)
crs_geographic: "EPSG:4326"

# --- Clustering (isoler un incendie parmi ses propres détections) ---
# Utilisé deux fois : une fois nationalement (00_detect_active_fires.py,
# via max_active_fires) pour séparer les feux les uns des autres, puis à
# nouveau par feu (03_cumulative_detection_envelopes.py, via
# max_clusters) pour séparer d'éventuels foyers secondaires au sein d'un
# même feu déjà isolé.
cluster:
  radius_km: 10          # rayon d'agrégation des détections d'un même feu
  min_points: 15         # taille minimale d'un cluster retenu
  max_clusters: 2        # foyers secondaires conservés au sein d'UN feu
  max_active_fires: 20   # feux distincts conservés à l'échelle nationale

  # Un feu sans aucune détection depuis ce délai n'est plus retraité
  # (krigeage/isochrones coûteux) à chaque exécution — l'historique
  # cumulé ne s'efface jamais, seuls d'anciens points y restent pour
  # toujours, donc sans ce délai un feu éteint continuerait à occuper
  # une place (et du temps de calcul) indéfiniment. Ses dernières
  # sorties publiées restent en ligne telles quelles.
  retire_after_days: 5

# --- Grille d'analyse ----------------------------------------
grid:
  resolution_m: 250      # taille de cellule de la grille d'interpolation
  margin_m: 12000        # grille plus large que le domaine de support
  support_buffer_m: 8000 # tampon autour de l'enveloppe des détections

# --- Krigeage ------------------------------------------------
kriging:
  variogram_model: "spherical"   # spherical | exponential | gaussian | linear
  nlags: 12
  weight: true                   # pondération des lags proches
  # anisotropie optionnelle (utile si le feu est très directionnel) :
  anisotropy_scaling: 1.0
  anisotropy_angle: 0.0
  # sous-échantillonnage si trop de points (le krigeage est en O(n^3))
  max_points: 800
  thinning_cell_m: 500   # première détection retenue par cellule spatiale

# --- Isochrones ----------------------------------------------
isochrones:
  step_hours: 6
  smooth_sigma: 1.0
  closure_tolerance_cells: 1.5
  boundary_guard_cells: 3
  max_distance_to_detection_km: 6.0
  min_length_km: 2.0
  min_area_km2: 0.5
  simplify_m: 75
  max_ros_kmh: 5.0

# --- Rose de propagation -------------------------------------
rose:
  n_sectors: 16          # nombre de secteurs azimutaux

# --- Vent (corrélation) --------------------------------------
wind:
  source: "open-meteo"   # open-meteo (ECMWF IFS) | era5 | csv
  # pour open-meteo : point représentatif (centre du feu par défaut)
  hourly_past_days: 2

# --- Sorties -------------------------------------------------
outputs:
  processed_dir: "data/processed"
  web_dir: "data/web"
  # formats d'export des isochrones et du champ de propagation
  formats: ["geojson", "gpkg"]
